name: Build Danygramm release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MICCONTROL_ALLOW_SAMPLE_API: 'false'
      MICCONTROL_ABIS: arm64-v8a
      MICCONTROL_GRADLE_WORKERS: '2'
    steps:
      - name: Checkout source without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Validate own API inputs and existing signing key
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          MICCONTROL_DEBUG_KEYSTORE_B64: ${{ secrets.MICCONTROL_DEBUG_KEYSTORE_B64 }}
        run: python3 scripts/ci-preflight.py

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Android SDK components
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Verify Android SDK tools
        shell: bash
        run: |
          command -v sdkmanager
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      - name: Fetch pinned submodules
        run: git submodule update --init --recursive --depth=1

      - name: Build non-debug arm64 standalone with own API
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: bash scripts/build-apk.sh

      - name: Verify final signing certificate
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            artifacts/Danygramm-arm64.apk > "$RUNNER_TEMP/danygramm-signature.txt"
          grep -Fxq 'Signer #1 certificate SHA-256 digest: 59e104c1d8b66e20c47119aed387993df655475cdd3153fb21bfb3752d85debe' \
            "$RUNNER_TEMP/danygramm-signature.txt"
          (cd artifacts && sha256sum -c Danygramm-arm64.apk.sha256)
          python3 scripts/verify-release-artifacts.py

      - name: Upload release APK, SHA-256 and update metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Danygramm-arm64-${{ github.run_number }}
          path: |
            artifacts/Danygramm-arm64.apk
            artifacts/Danygramm-arm64.apk.sha256
            artifacts/danygramm-update.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Record build scope
        shell: bash
        run: |
          version=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          digest=$(cut -d ' ' -f 1 artifacts/Danygramm-arm64.apk.sha256)
          {
            printf 'Danygramm %s / arm64-v8a / non-debug standalone\n\n' "$version"
            printf 'Source commit: %s\n\n' "$GITHUB_SHA"
            printf 'APK SHA-256: %s\n\n' "$digest"
            printf 'Existing signing identity verified; sample API disabled.\n\n'
            printf 'Build and signature checks passed. Authentication, messaging and calls were NOT validated.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove restored signing key
        if: always()
        run: rm -f .local/miccontrol-debug.keystore
