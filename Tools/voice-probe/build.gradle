buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.13.2' }
}
apply plugin: 'com.android.application'

android {
    namespace 'org.danygramm.voiceprobe'
    compileSdk 36
    defaultConfig {
        applicationId 'org.danygramm.voiceprobe'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1-diagnostic'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        assets.srcDirs = ['build/generated/probe/assets']
        jniLibs.srcDirs = ['build/generated/probe/jniLibs']
    }
    signingConfigs {
        qa {
            def keyPath = System.getenv('VOICE_PROBE_KEYSTORE')
            if (keyPath != null) {
                storeFile file(keyPath)
                storePassword System.getenv('VOICE_PROBE_KEY_PASSWORD')
                keyAlias 'voice-probe'
                keyPassword System.getenv('VOICE_PROBE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('VOICE_PROBE_KEYSTORE') != null) signingConfig signingConfigs.qa
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['onnx', 'f32'] }
    packaging { jniLibs { useLegacyPackaging = false } }
}
